<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Damper Markup embed example</title>
<style>
  body { margin: 0; font: 15px system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: #1f2733; background: #eef0f3; }
  header { padding: 10px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: #fff; border-bottom: 1px solid #d5dae1; }
  iframe { display: block; width: 100%; height: calc(100vh - 110px); border: 0; }
  #log { padding: 6px 16px; font-size: 13px; color: #667085; }
</style>
</head>
<body>
<header>
  <b>Host app example</b>
  <label>Send a file to the tool: <input type="file" id="pick" accept="application/pdf,image/*"></label>
</header>
<iframe id="markup" src="./"></iframe>
<div id="log">Exports from the tool show up here.</div>
<script>
  // Shows how another web app can drive Damper Markup in an iframe. See README.md.
  const frame = document.getElementById('markup');
  document.getElementById('pick').onchange = (e) => {
    const f = e.target.files[0];
    if (f) frame.contentWindow.postMessage({ type: 'markup:open', file: f, name: f.name }, '*');
  };
  window.addEventListener('message', (e) => {
    if (e.source !== frame.contentWindow || !e.data || e.data.type !== 'markup:export') return;
    document.getElementById('log').textContent = 'Got ' + e.data.name + ' (' + e.data.kind + ', ' + Math.round(e.data.blob.size / 1024) + ' KB) from the tool.';
  });
</script>
</body>
</html>
